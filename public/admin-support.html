<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Support</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}header{height:64px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header h1{font-size:20px;margin:0}#state{font-size:13px;color:#a7f3d0}.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 64px)}.sidebar{background:#fff;border-left:1px solid #ddd;overflow:auto}.sidehead{padding:15px;border-bottom:1px solid #eee;font-weight:bold}.conversation{padding:14px;border-bottom:1px solid #eee;cursor:pointer}.conversation:hover,.conversation.active{background:#eef2ff}.mac{font-weight:bold;font-size:14px}.meta{font-size:12px;color:#6b7280;margin-top:5px}.chat{display:flex;flex-direction:column;min-width:0}.chathead{background:#fff;border-bottom:1px solid #ddd;padding:14px;display:flex;align-items:center;gap:10px}#clientTitle{font-weight:bold}#clientMeta{font-size:12px;color:#6b7280;margin-top:4px}.back{display:none;border:0;background:#eee;border-radius:8px;padding:8px 12px;font-size:14px}.chathead-info{min-width:0}.chathead-info #clientTitle,.chathead-info #clientMeta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#messages{flex:1;overflow:auto;padding:18px}.msg{display:flex;margin:8px 0}.msg.client{justify-content:flex-start}.msg.support{justify-content:flex-end}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.client .bubble{background:#fff;border:1px solid #ddd}.support .bubble{background:#2563eb;color:#fff}.time{font-size:10px;opacity:.65;margin-top:4px}.composer{background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;gap:8px}.composer input{flex:1;border:1px solid #ccc;border-radius:10px;padding:12px;font-size:15px;direction:rtl}.composer button{border:0;background:#2563eb;color:#fff;border-radius:10px;padding:0 20px;font-size:15px}.composer button:disabled{opacity:.5}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777}@media(max-width:700px){.layout{display:block;position:relative;height:calc(100vh - 64px);overflow:hidden}.sidebar{height:100%;border-left:0}.chat{display:none;height:100%;position:absolute;inset:0;background:#f3f5f7}.mobile-chat-open .sidebar{display:none}.mobile-chat-open .chat{display:flex}.mobile-chat-open .back{display:block}.bubble{max-width:88%}.composer{padding:10px}.composer button{padding:0 15px}}
</style>
</head>
<body>
<header><h1>Admin Support</h1><div id="state">جاري الاتصال...</div></header>
<div class="layout">
<aside class="sidebar"><div class="sidehead">المحادثات</div><div id="conversationList"></div></aside>
<main class="chat">
<div class="chathead"><button class="back" id="backBtn" type="button">رجوع</button><div class="chathead-info"><div id="clientTitle">اختر محادثة</div><div id="clientMeta"></div></div></div>
<div id="messages"><div class="empty">لا توجد محادثة محددة</div></div>
<form class="composer" id="replyForm"><input id="replyInput" placeholder="اكتب رد الدعم..." autocomplete="off"><button id="sendBtn" type="submit">إرسال</button></form>
</main>
</div>
<script>
const SUPABASE_URL="https://quylfcqnzubxedlatzpv.supabase.co";
let SUPABASE_KEY="",supabase=null,channel=null,conversations=[],clients=[],selectedConversation=null;
async function loadKey(){const r=await fetch("/app.js"),t=await r.text(),m=t.match(/const SUPABASE_PUBLISHABLE_KEY\s*=\s*["']([^"']+)["']/);if(!m)throw new Error("لم يتم العثور على مفتاح Supabase");SUPABASE_KEY=m[1]}
async function api(path,options={}){const r=await fetch(SUPABASE_URL+path,{...options,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}}),text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(typeof data==="string"?data:data?.message||data?.error||("HTTP "+r.status));return data}
function fmt(d){if(!d)return "";return new Date(d).toLocaleString("ar-YE",{dateStyle:"short",timeStyle:"short"})}
function clientById(id){return clients.find(x=>String(x.id)===String(id))}
function renderConversations(){const box=document.getElementById("conversationList");if(!conversations.length){box.innerHTML='<div class="empty" style="height:120px">لا توجد محادثات</div>';return}box.innerHTML=conversations.map(c=>{const cl=clientById(c.client_id),mac=cl?.mac_address||"بدون MAC",username=cl?.username||"";return `<div class="conversation ${String(c.id)===String(selectedConversation)?"active":""}" onclick="openConversation(${c.id})"><div class="mac">${escapeHtml(mac)}</div><div class="meta">${escapeHtml(username||"عميل")} · ${fmt(c.updated_at)}</div><div class="meta">الحالة: ${escapeHtml(c.status||"open")}</div></div>`}).join("")}
async function loadBase(){conversations=await api("/rest/v1/conversations?select=id,client_id,status,created_at,updated_at&order=updated_at.desc");clients=await api("/rest/v1/clients?select=id,mac_address,username,last_seen_at");renderConversations();document.getElementById("state").textContent="متصل"}
async function openConversation(id){selectedConversation=id;document.body.classList.add("mobile-chat-open");renderConversations();const c=conversations.find(x=>String(x.id)===String(id)),cl=c?clientById(c.client_id):null;document.getElementById("clientTitle").textContent=cl?.mac_address||"عميل";document.getElementById("clientMeta").textContent=(cl?.username||"")+(cl?.last_seen_at?" · آخر ظهور "+fmt(cl.last_seen_at):"");await loadMessages()}
async function loadMessages(){if(!selectedConversation)return;const data=await api("/rest/v1/messages?select=id,conversation_id,sender,message,created_at&conversation_id=eq."+selectedConversation+"&order=created_at.asc"),box=document.getElementById("messages");if(!data.length){box.innerHTML='<div class="empty">لا توجد رسائل بعد</div>';return}box.innerHTML=data.map(renderMessage).join("");box.scrollTop=box.scrollHeight}
function renderMessage(m){const type=m.sender==="admin"?"support":"client";return `<div class="msg ${type}" data-message-id="${escapeHtml(m.id)}"><div><div class="bubble">${escapeHtml(m.message)}</div><div class="time">${fmt(m.created_at)}</div></div></div>`}
function appendRealtimeMessage(m){const box=document.getElementById("messages");if(box.querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`))return;const empty=box.querySelector(".empty");if(empty)box.innerHTML="";box.insertAdjacentHTML("beforeend",renderMessage(m));box.scrollTop=box.scrollHeight}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[s]))}
function initRealtime(){if(channel)return;channel=supabase.channel("admin-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{const m=payload.new;if(String(m.conversation_id)===String(selectedConversation)){appendRealtimeMessage(m)}try{await loadBase()}catch(err){console.error(err)} }).subscribe(status=>{if(status==="SUBSCRIBED")document.getElementById("state").textContent="متصل"})}
document.getElementById("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!selectedConversation){alert("اختر محادثة أولاً");return}const input=document.getElementById("replyInput"),btn=document.getElementById("sendBtn"),message=input.value.trim();if(!message)return;btn.disabled=true;try{await api("/rest/v1/messages",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({conversation_id:selectedConversation,sender:"admin",message})});input.value=""}catch(err){alert("خطأ: "+err.message)}finally{btn.disabled=false;input.focus()}})
document.getElementById("backBtn").addEventListener("click",()=>document.body.classList.remove("mobile-chat-open"));
(async()=>{try{await loadKey();const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await loadBase();initRealtime()}catch(err){console.error(err);document.getElementById("state").textContent="خطأ";alert(err.message)}})();
</script>
</body>
</html>
