<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Support</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}header{height:64px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header h1{font-size:20px;margin:0}#state{font-size:13px;color:#a7f3d0}.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 64px)}.sidebar{background:#fff;border-left:1px solid #ddd;overflow:auto}.sidehead{padding:15px;border-bottom:1px solid #eee;font-weight:bold;display:flex;align-items:center;justify-content:space-between;gap:10px}.new-chat-btn{border:0;background:#2563eb;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}.new-chat-btn:active{transform:scale(.98)}.conversation{padding:14px;border-bottom:1px solid #eee;cursor:pointer;position:relative}.conversation:hover,.conversation.active{background:#eef2ff}.mac{font-weight:bold;font-size:14px;padding-left:48px}.meta{font-size:12px;color:#6b7280;margin-top:5px;padding-left:48px}.unread-badge{position:absolute;left:14px;top:16px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#dc2626;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.16)}.chat{display:flex;flex-direction:column;min-width:0}.chathead{background:#fff;border-bottom:1px solid #ddd;padding:14px;display:flex;align-items:center;gap:10px}.chathead-info{min-width:0}.chathead-info #clientTitle,.chathead-info #clientMeta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#clientTitle{font-weight:bold}#clientMeta{font-size:12px;color:#6b7280;margin-top:4px}.back{display:none;border:0;background:#eee;border-radius:8px;padding:8px 12px;font-size:14px}.messages{flex:1;overflow:auto;padding:18px}.msg{display:flex;margin:8px 0}.msg.client{justify-content:flex-start}.msg.support{justify-content:flex-end}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.client .bubble{background:#fff;border:1px solid #ddd}.support .bubble{background:#2563eb;color:#fff}.time{font-size:10px;opacity:.65;margin-top:4px}.composer{background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;gap:8px}.composer input{flex:1;border:1px solid #ccc;border-radius:10px;padding:12px;font-size:15px;direction:rtl}.composer button{border:0;background:#2563eb;color:#fff;border-radius:10px;padding:0 20px;font-size:15px}.composer button:disabled{opacity:.5}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777}.new-chat-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.new-chat-overlay.open{display:flex}.new-chat-card{background:#fff;width:min(420px,100%);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.new-chat-card h2{margin:0 0 12px;font-size:18px}.new-chat-card p{margin:0 0 12px;color:#6b7280;font-size:13px}.new-chat-form{display:flex;gap:8px}.new-chat-form input{flex:1;border:1px solid #ccc;border-radius:10px;padding:12px;font-size:14px;direction:ltr;text-transform:uppercase}.new-chat-form button{border:0;background:#2563eb;color:#fff;border-radius:10px;padding:0 16px;font-size:14px}.new-chat-actions{display:flex;justify-content:flex-end;margin-top:10px}.cancel-btn{border:0;background:#eee;border-radius:10px;padding:8px 14px;font-size:13px}.toast{position:fixed;top:76px;right:20px;z-index:1100;background:#111827;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;max-width:320px}.toast.show{display:block}@media(max-width:700px){.layout{display:block;position:relative;height:calc(100vh - 64px);overflow:hidden}.sidebar{height:100%;border-left:0}.chat{display:none;height:100%;position:absolute;inset:0;background:#f3f5f7}.mobile-chat-open .sidebar{display:none}.mobile-chat-open .chat{display:flex}.mobile-chat-open .back{display:block}.bubble{max-width:88%}.composer{padding:10px}.composer button{padding:0 15px}}
</style>
<script src="supabase.js"></script>
</head>
<body>
<header><h1>Admin Support</h1><div id="state">جاري الاتصال...</div></header>
<div class="layout">
<aside class="sidebar"><div class="sidehead"><span>المحادثات</span><button class="new-chat-btn" id="newChatBtn" type="button">+ محادثة جديدة</button></div><div id="conversationList"></div></aside>
<main class="chat">
<div class="chathead"><button class="back" id="backBtn" type="button">رجوع</button><div class="chathead-info"><div id="clientTitle">اختر محادثة</div><div id="clientMeta"></div></div></div>
<div id="messages" class="messages"><div class="empty">لا توجد محادثة محددة</div></div>
<form class="composer" id="replyForm"><input id="replyInput" placeholder="اكتب رد الدعم..." autocomplete="off"><button id="sendBtn" type="submit">إرسال</button></form>
</main>
</div>
<div class="new-chat-overlay" id="newChatOverlay">
  <div class="new-chat-card">
    <h2>إنشاء محادثة جديدة</h2>
    <p>أدخل MAC Address للعميل. سيتم إنشاء العميل والمحادثة له مباشرة.</p>
    <form class="new-chat-form" id="newChatForm">
      <input id="newMacInput" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17" autocomplete="off" spellcheck="false">
      <button type="submit">إنشاء</button>
    </form>
    <div class="new-chat-actions"><button class="cancel-btn" id="cancelNewChat" type="button">إلغاء</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://quylfcqnzubxedlatzpv.supabase.co";
const SUPABASE_KEY="sb_publishable_9Nl91eoKWdraNH_kw2cCIg_GHRn-IJJ";
let supabase=null,channel=null,conversations=[],clients=[],selectedConversation=null,realtimeRetryTimer=null;
const unreadCounts={};
let notificationPermission="default";
async function api(path,options={}){const r=await fetch(SUPABASE_URL+path,{...options,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}}),text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(typeof data==="string"?data:data?.message||data?.error||("HTTP "+r.status));return data}
function fmt(d){if(!d)return "";return new Date(d).toLocaleString("ar-YE",{dateStyle:"short",timeStyle:"short"})}
function clientById(id){return clients.find(x=>String(x.id)===String(id))}
function conversationById(id){return conversations.find(x=>String(x.id)===String(id))}
function showToast(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),3200)}
function normalizeMac(value){return String(value||"").trim().toUpperCase().replace(/[^0-9A-F:.-]/g,"").replace(/-/g,":").replace(/\./g,":")}
function validMac(mac){return /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac)}
function requestNotifications(){if("Notification" in window&&Notification.permission==="default")Notification.requestPermission().then(p=>notificationPermission=p).catch(()=>{})}
function notifyNewMessage(m){const c=conversationById(m.conversation_id),cl=c?clientById(c.client_id):null,mac=cl?.mac_address||"عميل";if("Notification" in window&&Notification.permission==="granted"){try{const n=new Notification("رسالة جديدة",{body:`رسالة جديدة من ${mac}`});n.onclick=()=>{window.focus();openConversation(m.conversation_id)}}catch{}}
showToast(`🔴 رسالة جديدة من ${mac}`)}
function renderConversations(){const box=document.getElementById("conversationList");if(!conversations.length){box.innerHTML='<div class="empty" style="height:120px">لا توجد محادثات</div>';return}box.innerHTML=conversations.map(c=>{const cl=clientById(c.client_id),mac=cl?.mac_address||"بدون MAC",username=cl?.username||"",count=unreadCounts[String(c.id)]||0;return `<div class="conversation ${String(c.id)===String(selectedConversation)?"active":""}" onclick="openConversation(${c.id})"><div class="mac">${escapeHtml(mac)}</div><div class="meta">${escapeHtml(username||"عميل")} · ${fmt(c.updated_at)}</div><div class="meta">الحالة: ${escapeHtml(c.status||"open")}</div>${count?`<div class="unread-badge" aria-label="${count} رسائل غير مقروءة">${count>99?"99+":count}</div>`:""}</div>`}).join("")}
async function loadBase(){const [baseConversations,baseClients]=await Promise.all([api("/rest/v1/conversations?select=id,client_id,status,created_at,updated_at&order=updated_at.desc"),api("/rest/v1/clients?select=id,mac_address,username")]);conversations=baseConversations;clients=baseClients;for(const key of Object.keys(unreadCounts)){if(!conversations.some(c=>String(c.id)===key))delete unreadCounts[key]}renderConversations();document.getElementById("state").textContent="متصل"}
async function openConversation(id){selectedConversation=id;unreadCounts[String(id)]=0;renderConversations();document.body.classList.add("mobile-chat-open");const c=conversationById(id),cl=c?clientById(c.client_id):null;document.getElementById("clientTitle").textContent=cl?.mac_address||"عميل";document.getElementById("clientMeta").textContent=(cl?.username||"");await loadMessages()}
async function loadMessages(){if(!selectedConversation)return;const data=await api("/rest/v1/messages?select=id,conversation_id,sender,message,created_at&conversation_id=eq."+selectedConversation+"&order=created_at.desc&limit=100"),box=document.getElementById("messages");data.reverse();if(!data.length){box.innerHTML='<div class="empty">لا توجد رسائل بعد</div>';return}box.innerHTML=data.map(renderMessage).join("");box.scrollTop=box.scrollHeight}
function renderMessage(m){const type=m.sender==="admin"?"support":"client";return `<div class="msg ${type}" data-message-id="${escapeHtml(m.id)}"><div><div class="bubble">${escapeHtml(m.message)}</div><div class="time">${fmt(m.created_at)}</div></div></div>`}
function trimAdminMessages(){const box=document.getElementById("messages");while(box.querySelectorAll("[data-message-id]").length>100){box.querySelector("[data-message-id]")?.remove()}}
function appendRealtimeMessage(m){const box=document.getElementById("messages");const id=String(m.id);if([...box.children].some(el=>el.dataset.messageId===id))return;const empty=box.querySelector(".empty");if(empty)box.innerHTML="";box.insertAdjacentHTML("beforeend",renderMessage(m));trimAdminMessages();box.scrollTop=box.scrollHeight}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[s]))}
function scheduleRealtimeRetry(){if(realtimeRetryTimer)return;realtimeRetryTimer=setTimeout(()=>{realtimeRetryTimer=null;initRealtime()},4000)}
function updateConversationFromMessage(m){const c=conversationById(m.conversation_id);if(!c)return;c.updated_at=m.created_at||new Date().toISOString();conversations.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));renderConversations()}
function initRealtime(){if(!supabase)return;if(channel){try{supabase.removeChannel(channel)}catch{}channel=null}channel=supabase.channel("admin-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{const m=payload.new;updateConversationFromMessage(m);if(String(m.sender)==="client"&&String(m.conversation_id)!==String(selectedConversation)){const key=String(m.conversation_id);unreadCounts[key]=(unreadCounts[key]||0)+1;renderConversations();notifyNewMessage(m)}if(String(m.conversation_id)===String(selectedConversation))appendRealtimeMessage(m)}).subscribe(status=>{if(status==="SUBSCRIBED")document.getElementById("state").textContent="متصل";else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){document.getElementById("state").textContent="إعادة الاتصال...";scheduleRealtimeRetry()}})}
async function createNewConversation(mac){mac=normalizeMac(mac);if(!validMac(mac)){showToast("MAC Address غير صحيح");return}const existingClient=(await api("/rest/v1/clients?select=id,mac_address,username&mac_address=eq."+encodeURIComponent(mac)+"&limit=1"))[0];let clientId;if(existingClient){clientId=existingClient.id}else{const created=await api("/rest/v1/clients",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({mac_address:mac})});clientId=Array.isArray(created)?created[0]?.id:created?.id}if(!clientId)throw new Error("تعذر إنشاء العميل");const existingConv=(await api("/rest/v1/conversations?select=id,client_id,status,created_at,updated_at&client_id=eq."+encodeURIComponent(clientId)+"&order=created_at.desc&limit=1"))[0];if(existingConv){showToast("المحادثة موجودة بالفعل");await loadBase();openConversation(existingConv.id);return}const createdConv=await api("/rest/v1/conversations",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({client_id:clientId,status:"open"})});const conv=Array.isArray(createdConv)?createdConv[0]:createdConv;if(!conv?.id)throw new Error("تعذر إنشاء المحادثة");await loadBase();openConversation(conv.id);showToast("تم إنشاء المحادثة بنجاح")}
document.getElementById("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!selectedConversation){alert("اختر محادثة أولاً");return}const input=document.getElementById("replyInput"),btn=document.getElementById("sendBtn"),message=input.value.trim();if(!message)return;btn.disabled=true;try{await api("/rest/v1/messages",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({conversation_id:selectedConversation,sender:"admin",message})});input.value=""}catch(err){alert("خطأ: "+err.message)}finally{btn.disabled=false;input.focus()}})
document.getElementById("newChatBtn").addEventListener("click",()=>{requestNotifications();document.getElementById("newChatOverlay").classList.add("open");document.getElementById("newMacInput").focus()});
document.getElementById("cancelNewChat").addEventListener("click",()=>document.getElementById("newChatOverlay").classList.remove("open"));
document.getElementById("newChatOverlay").addEventListener("click",e=>{if(e.target.id==="newChatOverlay")e.currentTarget.classList.remove("open")});
document.getElementById("newChatForm").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("newMacInput"),btn=e.target.querySelector("button[type=submit]");btn.disabled=true;try{await createNewConversation(input.value);input.value="";document.getElementById("newChatOverlay").classList.remove("open")}catch(err){showToast("خطأ: "+err.message)}finally{btn.disabled=false}});
document.getElementById("backBtn").addEventListener("click",()=>document.body.classList.remove("mobile-chat-open"));
(async()=>{try{if("Notification" in window)notificationPermission=Notification.permission;if(!window.supabase?.createClient)throw new Error("تعذر تحميل مكتبة Supabase المحلية");supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await loadBase();initRealtime()}catch(err){console.error(err);document.getElementById("state").textContent="خطأ";alert(err.message)}})();
</script>
</body>
</html>
